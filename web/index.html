<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e5f93'/%3E%3Cpath d='M17.5 5 9 18h6l-1.5 9L23 13h-6z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>SynthGuard 生图台</title>
    <script>
      // apply the saved theme before first paint (no light flash in dark mode)
      try {
        var t = localStorage.getItem("sg.theme") || "system";
        var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
